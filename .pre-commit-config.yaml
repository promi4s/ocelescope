default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-yaml
        files: .*\.py$
        exclude: ^template/
      - id: end-of-file-fixer
        stages: [pre-commit]
        files: .*\.py$
        exclude: ^template/
      - id: trailing-whitespace
        stages: [pre-commit]
        files: .*\.py$
  # ruff runs through uv so it uses the version pinned in uv.lock, the same one CI uses.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^template/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^template/
  - repo: https://github.com/biomejs/pre-commit
    rev: "v0.6.1"
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.5.12"]
  - repo: local
    hooks:
      - id: generate-api
        name: Generate Openapi json
        entry: pnpm run api:generate
        language: system
        pass_filenames: false
        files: ^src/backend/
      - id: typecheck-backend
        name: Typecheck (backend)
        entry: pnpm run typecheck:backend
        language: system
        pass_filenames: false
        files: \.py$
        exclude: ^template/
      - id: typecheck-frontend
        name: Typecheck (frontend)
        entry: pnpm run typecheck:frontend
        language: system
        pass_filenames: false
        types_or: [ts, tsx, javascript, jsx]
        exclude: ^template/
      # Push-only: whole-repo passes that are too slow for every commit.
      - id: check
        name: Lint and format (autofix)
        entry: pnpm run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: spellcheck
        name: Spellcheck
        entry: pnpm run spellcheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

[project]
name = "ocelescope-backend"
version = "0.5.0"
description = "Ocelescope backend host application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pm4py~=2.7.23",
  "pandas>=2.3.1",
  "numpy>=2.3.2",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.2.1,<3",
  "fastapi[standard]>=0.136.0",
  "uvicorn>=0.49,<0.50",
  "ocelescope[plugin]>=0.5.0,<0.6.0",
  "orjson>=3.11.3",
]

[project.scripts]
ocelescope-backend = "ocelescope_backend.cli:app"

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
ocelescope = { workspace = true }

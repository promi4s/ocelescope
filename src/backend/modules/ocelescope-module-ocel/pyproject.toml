[project]
name = "ocelescope-module-ocel"
version = "0.5.0"
description = "Ocelescope backend module exposing OCEL inspection routes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.0",
  "ocelescope>=0.5.0,<0.6.0",
  "ocelescope-backend>=0.5.0,<0.6.0",
  "polars>=1.40",
]

[project.entry-points."ocelescope_backend.modules"]
ocelV1 = "ocelescope_module_ocel.module:Ocel"


[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
ocelescope = { workspace = true }
ocelescope-backend = { workspace = true }

[project]
name = "ocelescope-module-plugin"
version = "0.11.0"
description = "Ocelescope backend module for uploading and running plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.0",
  "ocelescope[plugin]>=0.11.0,<0.12.0",
  "ocelescope-backend>=0.11.0,<0.12.0",
  "orjson>=3.11.3",
  "packaging>=24.0",
  "pandas>=2.3.1",
  "plotly>=6.3.1",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.2.1,<3",
]

[project.entry-points."ocelescope_backend.modules"]
pluginV1 = "ocelescope_module_plugin.module:PluginModule"


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
ocelescope = { workspace = true }
ocelescope-backend = { workspace = true }

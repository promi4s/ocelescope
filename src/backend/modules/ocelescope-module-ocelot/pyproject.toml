[project]
name = "ocelescope-module-ocelot"
version = "0.1.1"
description = "Ocelescope backend module for Ocelot: exploring events, objects and their relationships in OCELs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.136.0",
  "ocelescope>=0.3.0,<0.4.0",
  "ocelescope-backend>=0.1.0,<0.2.0",
]

[project.entry-points."ocelescope_backend.modules"]
ocelotV1 = "ocelescope_module_ocelot.module:Ocelot"


[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
ocelescope = { workspace = true }
ocelescope-backend = { workspace = true }

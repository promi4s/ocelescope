[project]
name = "ocelescope"
version = "0.2.0"
description = "General tools for working with Object-Centric Event Logs and building Ocelescope plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cachetools>=6.1.0",
  "graphviz>=0.21",
  "matplotlib>=3.10.9",
  "numpy>=2.3.2",
  "orjson>=3.11.7",
  "pandas>=2.3.1",
  "plotly>=6.3.1",
  "pm4py~=2.7.22",
  "polars[pyarrow]>=1.40.1",
  "pydantic>=2.11.7",
  "r4pm[polars]>=0.5.3",
]

[project.scripts]
ocelescope = "ocelescope.tools.cli:main"

[tool.uv]
package = true

[project.optional-dependencies]
plugin = [
    "more-itertools>=11.1.0",
    "networkx>=3.5",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
fix = true
lint.ignore = ["E731", "E501"]

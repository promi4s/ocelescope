name: release

on:
  release:
    types: [published]


jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push multi-arch images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        env:
          VERSION: ${{ github.event.release.tag_name }}
        with:
          source: .
          files: ./docker-bake.hcl
          push: true
          set: |
            *.platform=linux/amd64,linux/arm64

name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - '.github/workflows/ci.yml'
              - 'src/**/*.py'
              - 'scripts/**/*.py'
              - '**/pyproject.toml'
              - 'uv.lock'
              - '.python-version'
            backend:
              - '.github/workflows/ci.yml'
              - 'src/backend/**'
              - 'src/ocelescope/**'
              - 'uv.lock'
              - '.python-version'
            frontend:
              - '.github/workflows/ci.yml'
              - 'src/frontend/**'
              - 'biome.json'
              - '**/package.json'
              - '**/tsconfig*.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  python-ruff:
    name: Python - ruff (lint + format check)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: "uv.lock"
          args: "check ./src"

      - name: Ruff format (check)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: "uv.lock"
          args: "format --check --diff ./src"

  python-ty:
    name: Python - ty (typecheck)
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install the project
        run: uv sync --locked --all-packages

      - name: ty check
        run: uv run ty check ./src/

  frontend-biome:
    name: Frontend - biome (lint + format check)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2

      - name: Biome CI
        run: biome ci

  frontend-typecheck:
    name: Frontend - tsc (typecheck)
    needs: changes
    # The API client is generated from the backend, so backend changes can
    # affect the frontend types too.
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install backend (needed to generate the API client)
        run: uv sync --locked --all-packages

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client and build packages
        run: pnpm run api:sync

      - name: Typecheck
        run: pnpm run typecheck:frontend

  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9
        with:
          config: ./cspell.json
          files: |
            README.md
            CONTRIBUTING.md
            .github/**/*.yml
            src/**/*.py
            src/**/*.ts
            src/**/*.tsx

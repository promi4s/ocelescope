[project]
name = "ocelescope-workspace"
version = "0.1.0"
description = "Workspace for ocelescope package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ocelescope-module-ocel>=0.1.0",
  "ocelescope-module-ocelot>=0.1.1",
]

[tool.uv.workspace]
members = [
  "src/ocelescope",
  "src/backend/ocelescope-backend",
  "src/backend/modules/*",
]

[tool.uv.sources]
ocelescope-module-ocel = { workspace = true }

[tool.ruff.lint]
ignore = ["E731"]

[tool.ty.rules]
# Existing `# type: ignore` comments target mypy/pyright; ty uses its own
# `# ty: ignore` directive, so it sees those as unused. Don't warn on them.
unused-type-ignore-comment = "ignore"
# Casts that ty considers redundant are kept for the other type checkers.
redundant-cast = "ignore"

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "typecheck" }]

lint = ["ruff>=0.15.7"]

typecheck = ["lxml-stubs>=0.5.1", "ty>=0.0.51"]

docs = [
  "mkdocs>=1.6.1",
  "mkdocs-autorefs>=1.4.4",
  "mkdocs-awesome-nav>=3.3.0",
  "mkdocs-git-revision-date-localized-plugin>=1.5.1",
  "mkdocs-material>=9.7.6",
  "mkdocs-minify-plugin>=0.8.0",
  "mkdocstrings-python>=2.0.3",
  "mkdocs-macros-plugin>=1.0.5",
  "pygithub>=2.9.1",
]

repl = ["ipython>=9.11.0", "ipython-autotime>=0.3.2"]
